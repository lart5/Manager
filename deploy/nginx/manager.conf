# Host-level reverse proxy for Manager Server (single VPS, docker compose).
#
#   manager.example.com -> server 127.0.0.1:4010 (ManagerServer/docker-compose.yml, SERVER_PORT)
#
# Replace manager.example.com with your domain (and 4010 if SERVER_PORT differs), then:
#   sudo cp deploy/nginx/manager.conf /etc/nginx/sites-available/manager.conf
#   sudo ln -s /etc/nginx/sites-available/manager.conf /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/certbot
#   sudo certbot certonly --webroot -w /var/www/certbot --cert-name manager.example.com \
#       -d manager.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Before the first certificate exists, comment out the 443 server block
# (nginx -t fails on missing cert files), obtain the cert, then restore it.
#
# Requires nginx >= 1.25.1 ("http2 on;"). On older nginx replace
# "listen 443 ssl; http2 on;" with "listen 443 ssl http2;".

upstream manager_server {
    server 127.0.0.1:4010;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# HTTP: ACME challenge + redirect everything to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name manager.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Manager Server: manager.example.com
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name manager.example.com;

    ssl_certificate     /etc/letsencrypt/live/manager.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manager.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:manager_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/manager.access.log;
    error_log  /var/log/nginx/manager.error.log;

    # Large files (backups, imports) arrive in <= 10 MB chunks via /upload/chunk;
    # regular forms and attachments are capped by Kestrel at ~30 MB anyway.
    client_max_body_size 32m;

    location / {
        proxy_pass http://manager_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Reports, PDF rendering and backups of big businesses can take a while.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;
    }
}
