name: Server CI

on:
    pull_request:
        paths:
            - 'ManagerServer/**'
            - '.github/workflows/ci-server.yml'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x
            - run: dotnet build ManagerServer/ManagerServer.csproj -c Release

    image:
        needs: validate
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - name: Build image
              uses: docker/build-push-action@v6
              with:
                  context: ManagerServer
                  push: false
                  provenance: false
                  sbom: false
                  build-args: |
                      APP_RELEASE=${{ github.sha }}
                  cache-from: type=gha,scope=server
